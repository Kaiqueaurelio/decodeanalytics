<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080C1F">
  <title>Sem conexão | Decode Analytics</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif;background:#080c1f;color:#f8fafc}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,480px);padding:clamp(24px,6vw,40px);border:1px solid #26304e;border-radius:24px;background:#10162e;text-align:center}
    img{width:min(180px,60%);height:auto;margin:0 auto 24px}h1{font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.1;margin:0 0 12px}
    p{color:#cbd5e1;line-height:1.7;margin:0 0 24px}button{min-height:48px;padding:12px 20px;border:0;border-radius:12px;background:linear-gradient(90deg,#087cf0,#7138f5);color:white;font:700 1rem inherit;cursor:pointer}
    button:focus-visible{outline:3px solid #22d3ee;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <img src="/brand/decode-logo.svg" alt="Decode Analytics">
    <h1>Você está sem conexão</h1>
    <p>Não conseguimos carregar esta página agora. Verifique sua internet e tente novamente. Por segurança, informações de conta e dados operacionais não são armazenados para uso offline.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
